apiVersion: v1
kind: Service
metadata:
  name: {{ include "asa-workspace.fullname" . }}
  labels:
    {{- include "asa-workspace.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    app.kubernetes.io/name: {{ include "asa-workspace.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    asa-workspace-role: api
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
