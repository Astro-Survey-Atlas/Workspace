{{- if .Values.downloads.enabled }}
{{- if not .Values.productionData.enabled }}{{ fail "downloads.enabled requires productionData.enabled with shared storage" }}{{- end }}
{{- $workerName := printf "%s-downloader" (include "asa-workspace.fullname" .) }}
{{- if not .Values.downloads.existingSecret }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $workerName }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $workerName }}
type: Opaque
data:
  {{ .Values.downloads.secretKey }}: {{ if $existing }}{{ index $existing.data .Values.downloads.secretKey }}{{ else }}{{ randAlphaNum 48 | b64enc | quote }}{{ end }}
---
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $workerName }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ $workerName }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ $workerName }}
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: downloader
          image: {{ printf "%s:%s" .Values.downloads.image.repository .Values.downloads.image.tag | quote }}
          imagePullPolicy: {{ .Values.downloads.image.pullPolicy }}
          command: ["node", "/app/dist/download-worker.js"]
          ports:
            - name: http
              containerPort: 7080
          env:
            - name: PORT
              value: "7080"
            - name: ASTRO_DOWNLOAD_STORAGE_ROOT
              value: {{ .Values.productionData.mountPath | quote }}
            - name: ASTRO_DOWNLOAD_WORKER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ default $workerName .Values.downloads.existingSecret }}
                  key: {{ .Values.downloads.secretKey }}
          resources:
            {{- toYaml .Values.downloads.resources | nindent 12 }}
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
          volumeMounts:
            - name: production-data
              mountPath: {{ .Values.productionData.mountPath | quote }}
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: production-data
          persistentVolumeClaim:
            claimName: {{ include "asa-workspace.productionDataClaim" . }}
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $workerName }}
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 7080
      targetPort: http
  selector:
    app.kubernetes.io/name: {{ $workerName }}
    app.kubernetes.io/instance: {{ .Release.Name }}
{{- end }}
