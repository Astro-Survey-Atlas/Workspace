{{- if .Values.scanner.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "asa-workspace.fullname" . }}-scanner
  labels:
    {{- include "asa-workspace.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "asa-workspace.name" . }}-scanner
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "asa-workspace.name" . }}-scanner
        app.kubernetes.io/instance: {{ .Release.Name }}
        asa-workspace-role: scanner
    spec:
      automountServiceAccountToken: false
      serviceAccountName: default
      terminationGracePeriodSeconds: 60
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{ toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector: {{ toYaml . | nindent 8 }}
      {{- end }}
      affinity:
        podAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app.kubernetes.io/name: {{ include "asa-workspace.name" . }}
                  app.kubernetes.io/instance: {{ .Release.Name }}
                  asa-workspace-role: api
              topologyKey: kubernetes.io/hostname
      securityContext: {{ toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: workspace
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["node", "dist/scan-worker.js"]
          env:
            {{- include "asa-workspace.runtimeEnv" . | nindent 12 }}
            - name: NODE_OPTIONS
              value: --max-old-space-size=1024
            - name: OTEL_SERVICE_NAME
              value: asa-workspace-scanner
          resources: {{ toYaml .Values.scanner.resources | nindent 12 }}
          securityContext: {{ toYaml .Values.containerSecurityContext | nindent 12 }}
          volumeMounts:
            {{- include "asa-workspace.mounts" . | nindent 12 }}
      volumes:
        {{- include "asa-workspace.volumes" . | nindent 8 }}
{{- end }}
