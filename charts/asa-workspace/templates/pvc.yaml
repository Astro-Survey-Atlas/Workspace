{{- if and .Values.persistence.enabled (not .Values.persistence.existingClaim) }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "asa-workspace.fullname" . }}-state
  annotations:
    helm.sh/resource-policy: keep
  labels:
    {{- include "asa-workspace.labels" . | nindent 4 }}
spec:
  accessModes: {{ toYaml .Values.persistence.accessModes | nindent 4 }}
  resources:
    requests:
      storage: {{ .Values.persistence.size }}
  {{- with .Values.persistence.storageClass }}
  storageClassName: {{ . | quote }}
  {{- end }}
{{- end }}
{{- if and .Values.productionData.enabled (not .Values.productionData.existingClaim) }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "asa-workspace.productionDataClaim" . }}
  annotations:
    helm.sh/resource-policy: keep
  labels:
    {{- include "asa-workspace.labels" . | nindent 4 }}
    atlas.zhejianglab.org/scanner-source: "true"
spec:
  accessModes: {{ toYaml .Values.productionData.accessModes | nindent 4 }}
  resources:
    requests:
      storage: {{ .Values.productionData.size }}
  {{- with .Values.productionData.storageClass }}
  storageClassName: {{ . | quote }}
  {{- end }}
{{- end }}
