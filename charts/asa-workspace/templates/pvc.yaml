{{- if and .Values.persistence.enabled (not .Values.persistence.existingClaim) }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "asa-workspace.fullname" . }}-state
  labels:
    {{- include "asa-workspace.labels" . | nindent 4 }}
spec:
  accessModes: {{ toYaml .Values.persistence.accessModes | nindent 4 }}
  resources:
    requests:
      storage: {{ .Values.persistence.size }}
  {{- with .Values.persistence.storageClass }}
  storageClassName: {{ . | quote }}
  {{- end }}
{{- end }}
{{- if and .Values.dataWarehouse.enabled (not .Values.dataWarehouse.evidence.existingClaim) }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "asa-workspace.warehouseEvidenceClaim" . }}
  labels:
    {{- include "asa-workspace.labels" . | nindent 4 }}
    atlas.zhejianglab.org/evidence: "true"
spec:
  accessModes: {{ toYaml .Values.dataWarehouse.evidence.accessModes | nindent 4 }}
  resources:
    requests:
      storage: {{ .Values.dataWarehouse.evidence.size }}
  {{- with .Values.dataWarehouse.evidence.storageClass }}
  storageClassName: {{ . | quote }}
  {{- end }}
{{- end }}
