apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "asa-workspace.fullname" . }}
  labels:
    {{- include "asa-workspace.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "asa-workspace.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "asa-workspace.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        asa-workspace-role: api
    spec:
      automountServiceAccountToken: false
      serviceAccountName: default
      terminationGracePeriodSeconds: 60
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{ toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector: {{ toYaml . | nindent 8 }}
      {{- end }}

      securityContext: {{ toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: workspace
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["node", "dist/http-server.js"]
          env:
            {{- include "asa-workspace.runtimeEnv" . | nindent 12 }}
            - name: OTEL_SERVICE_NAME
              value: asa-workspace
            - name: HOST
              value: "0.0.0.0"
            - name: PORT
              value: "3000"
            {{- if .Values.downloads.enabled }}
            - name: ASTRO_DOWNLOAD_WORKER_URL
              value: {{ printf "http://%s-downloader:7080" (include "asa-workspace.fullname" .) | quote }}
            - name: ASTRO_DOWNLOAD_WORKER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ default (printf "%s-downloader" (include "asa-workspace.fullname" .)) .Values.downloads.existingSecret }}
                  key: {{ .Values.downloads.secretKey }}
            {{- end }}
          ports:
            - name: http
              containerPort: 3000
          startupProbe:
            httpGet:
              path: /healthz
              port: http
              httpHeaders: [{name: Host, value: localhost}]
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
              httpHeaders: [{name: Host, value: localhost}]
            periodSeconds: 5
            timeoutSeconds: 2
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
              httpHeaders: [{name: Host, value: localhost}]
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 6
          resources: {{ toYaml .Values.resources | nindent 12 }}
          securityContext: {{ toYaml .Values.containerSecurityContext | nindent 12 }}
          volumeMounts:
            {{- include "asa-workspace.mounts" . | nindent 12 }}
      volumes:
        {{- include "asa-workspace.volumes" . | nindent 8 }}
