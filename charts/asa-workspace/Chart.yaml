apiVersion: v2
name: asa-workspace
description: Lightweight deployment of the Astro Data Workspace service
type: application
version: 0.0.1
appVersion: "0.0.1"
dependencies:
  - name: postgresql
    version: 16.7.27
    repository: https://charts.bitnami.com/bitnami
    condition: postgresql.enabled
  - name: elasticsearch
    version: 21.6.3
    repository: https://charts.bitnami.com/bitnami
    condition: elasticsearch.enabled
