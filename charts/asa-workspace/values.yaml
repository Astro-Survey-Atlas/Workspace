# Local SQLite state must be on a local filesystem; API and scanner share one node.
replicaCount: 1
image:
  repository: ghcr.io/astro-survey-atlas/asa-workspace
  tag: 0.0.1
  pullPolicy: IfNotPresent
imagePullSecrets: []
nameOverride: ''
fullnameOverride: ''
service:
  type: ClusterIP
  port: 3000
ingress:
  enabled: false
  className: ''
  annotations: {}
  hosts:
  - host: asa-workspace.local
    paths:
    - path: /
      pathType: Prefix
  tls: []
persistence:
  enabled: true
  storageClass: local-path
  accessModes:
  - ReadWriteOnce
  size: 20Gi
  existingClaim: ''
localData:
  enabled: false
  existingClaim: ''
  nfs:
    server: ''
    path: ''
  hostPath:
    path: ''
    type: Directory
  nodeSelector: {}
productionData:
  enabled: false
  existingClaim: ''
  storageClass: ''
  accessModes:
  - ReadWriteMany
  size: 20Gi
  mountPath: /data/production
downloads:
  enabled: false
  image:
    repository: ghcr.io/astro-survey-atlas/asa-workspace-downloader
    tag: aria2-1.37.0
    pullPolicy: IfNotPresent
  existingSecret: ''
  secretKey: token
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: '1'
      memory: 512Mi
search:
  mode: bundled
  timeoutMs: 2500
  external:
    url: ''
    existingSecret: ''
    existingSecretKey: elasticsearch-url
  bundled:
    image:
      repository: docker.io/bitnamilegacy/elasticsearch
      tag: 8.18.0-debian-12-r2
      pullPolicy: IfNotPresent
    heapSize: 512m
    persistence:
      storageClass: local-path
      size: 30Gi
      existingClaim: ''
    nodeSelector: {}
    resources:
      requests:
        cpu: 250m
        memory: 1Gi
      limits:
        cpu: '2'
        memory: 2Gi
env: []
networkProxy:
  enabled: false
  url: ''
  noProxy:
  - localhost
  - 127.0.0.1
  - ::1
  - .svc
  - .cluster.local
telemetry:
  enabled: false
  endpoint: http://otel-collector.observability.svc:4318
  serviceName: asa-workspace
  cluster: zjlab
  environment: dev
  metricExportIntervalMs: 15000
  captureContent: false
scanner:
  enabled: true
  paused: true
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: '1'
      memory: 1536Mi
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: '1'
    memory: 2Gi
podSecurityContext:
  fsGroup: 10001
  fsGroupChangePolicy: OnRootMismatch
  seccompProfile:
    type: RuntimeDefault
containerSecurityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
    - ALL
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 10001
  seccompProfile:
    type: RuntimeDefault
nodeSelector: {}
