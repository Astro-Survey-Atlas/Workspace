{{- if .Values.dataWarehouse.enabled }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "astro-data-workspace.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "astro-data-workspace.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "create", "update", "patch", "delete"]
  - apiGroups: ["atlas.zhejianglab.org"]
    resources: ["scanrequests"]
    verbs: ["get", "list", "watch", "create", "patch", "update"]
  - apiGroups: ["atlas.zhejianglab.org"]
    resources: ["scanrequests/status"]
    verbs: ["get", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "astro-data-workspace.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "astro-data-workspace.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "astro-data-workspace.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "astro-data-workspace.fullname" . }}
{{- end }}
