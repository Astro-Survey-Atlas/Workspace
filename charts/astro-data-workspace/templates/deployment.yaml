apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "astro-data-workspace.fullname" . }}
  labels:
    {{- include "astro-data-workspace.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "astro-data-workspace.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        {{- include "astro-data-workspace.labels" . | nindent 8 }}
    spec:
      automountServiceAccountToken: {{ .Values.dataWarehouse.enabled }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{ toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.dataWarehouse.enabled }}
      serviceAccountName: {{ include "astro-data-workspace.serviceAccountName" . }}
      {{- end }}
      {{- if gt (len .Values.localData.nodeSelector) 0 }}
      nodeSelector: {{ toYaml .Values.localData.nodeSelector | nindent 8 }}
      {{- end }}
      securityContext: {{ toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: workspace
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: HOST
              value: 0.0.0.0
            - name: PORT
              value: "3000"
            - name: ASTRO_WORKSPACE_STATE
              value: /state/registry.json
            - name: ASTRO_DATA_CATALOG_STATE
              value: /state/data-catalog.json
            - name: ASTRO_SURVEY_REGISTRY_STATE
              value: /state/survey-registrations.json
            - name: ASTRO_MANUAL_FOOTPRINT_STATE
              value: /state/manual-footprints.json
            - name: ASTRO_CONNECTOR_STATE
              value: /state/connectors.json
            - name: ASTRO_CONNECTOR_RUN_STATE
              value: /state/connector-ingest-runs.json
            - name: ASTRO_CONNECTOR_BOOTSTRAP
              value: /app/bootstrap/connectors.json
            - name: ASTRO_ALLOWED_ROOTS
              value: {{ ternary "/state:/data/local" "/state" .Values.localData.enabled | quote }}
            - name: ASTRO_WORKFLOW_ROOT
              value: /state/workflow-runs
            - name: ASTRO_RESOURCE_PACKAGE_ROOT
              value: /state/resource-packages
            - name: ASTRO_RESOURCE_PACKAGE_STATE
              value: /state/resource-package-state.json
            {{- if .Values.localData.enabled }}
            - name: ASTRO_LOCAL_CONNECTOR_ROOTS
              value: /data/local
            {{- end }}
            - name: ASTRO_METADATA_STORE
              value: {{ ternary "sqlite" "postgres" (eq .Values.metadataStore.mode "sqlite") | quote }}
            {{- if eq .Values.metadataStore.mode "sqlite" }}
            - name: ASTRO_SQLITE_PATH
              value: {{ .Values.metadataStore.sqlite.path | quote }}
            {{- else if eq .Values.metadataStore.mode "bundled-postgresql" }}
            - name: ASTRO_DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ default (include "astro-data-workspace.postgresqlFullname" .) .Values.postgresql.auth.existingSecret | quote }}
                  key: {{ .Values.postgresql.auth.secretKeys.userPasswordKey | quote }}
            - name: ASTRO_DATABASE_URL
              value: {{ printf "postgresql://%s:$(ASTRO_DATABASE_PASSWORD)@%s:5432/%s" .Values.postgresql.auth.username (include "astro-data-workspace.postgresqlFullname" .) .Values.postgresql.auth.database | quote }}
            {{- else }}
            - name: ASTRO_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.metadataStore.external.existingSecret | quote }}
                  key: {{ .Values.metadataStore.external.existingSecretKey | quote }}
            {{- end }}
            - name: ASTRO_ES_URL
              {{- if eq .Values.search.mode "bundled" }}
              value: {{ include "astro-data-workspace.elasticsearchUrl" . | quote }}
              {{- else }}
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.search.external.existingSecret | quote }}
                  key: {{ .Values.search.external.existingSecretKey | quote }}
              {{- end }}
            - name: ASTRO_ES_ASTRO_INDEX
              value: {{ .Values.search.index.file | quote }}
            - name: ASTRO_ES_OBJECT_INDEX
              value: {{ .Values.search.index.object | quote }}
            - name: ASTRO_ES_COVERAGE_INDEX
              value: {{ .Values.search.index.coverage | quote }}
            - name: ASTRO_LOCAL_SCAN_ENABLED
              value: {{ .Values.search.localScanEnabled | quote }}
            {{- if .Values.dataWarehouse.enabled }}
            - name: ASTRO_FLINK_NAMESPACE
              value: {{ .Values.dataWarehouse.namespace | quote }}
            - name: ASTRO_FLINK_SECRET_NAMESPACE
              value: {{ .Values.dataWarehouse.namespace | quote }}
            - name: ASTRO_FLINK_POLL_MS
              value: {{ .Values.dataWarehouse.pollIntervalMs | quote }}
            - name: ASTRO_FLINK_ES_HOST
              value: {{ .Values.dataWarehouse.elasticsearch.host | quote }}
            - name: ASTRO_FLINK_ES_PORT
              value: {{ .Values.dataWarehouse.elasticsearch.port | quote }}
            - name: ASTRO_FLINK_ES_SCHEMA
              value: {{ .Values.dataWarehouse.elasticsearch.schema | quote }}
            {{- end }}
            {{- with .Values.env }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 30
          readinessProbe:
            exec:
              command:
                - node
                - -e
                - |
                  const decode = (value) => { try { return decodeURIComponent(value); } catch { return value; } };
                  const endpoint = new URL(process.env.ASTRO_ES_URL);
                  const headers = {};
                  if (endpoint.username || endpoint.password) {
                    headers.Authorization = `Basic ${Buffer.from(`${decode(endpoint.username)}:${decode(endpoint.password)}`).toString("base64")}`;
                    endpoint.username = "";
                    endpoint.password = "";
                  }
                  endpoint.pathname = `${endpoint.pathname.replace(/\/+$/, "")}/_cluster/health`;
                  endpoint.search = "wait_for_status=yellow&timeout=1s";
                  Promise.all([
                    fetch("http://127.0.0.1:3000/healthz", { signal: AbortSignal.timeout(1500) }),
                    fetch(endpoint, { headers, signal: AbortSignal.timeout(1500) }),
                  ]).then(([app, search]) => process.exit(app.ok && search.ok ? 0 : 1)).catch(() => process.exit(1));
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          resources: {{ toYaml .Values.resources | nindent 12 }}
          securityContext: {{ toYaml .Values.containerSecurityContext | nindent 12 }}
          volumeMounts:
            - name: state
              mountPath: /state
            - name: tmp
              mountPath: /tmp
            {{- if .Values.localData.enabled }}
            - name: local-data
              mountPath: /data/local
              readOnly: true
            {{- end }}
      volumes:
        - name: state
          {{- if .Values.persistence.existingClaim }}
          persistentVolumeClaim:
            claimName: {{ .Values.persistence.existingClaim }}
          {{- else if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "astro-data-workspace.fullname" . }}-state
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: tmp
          emptyDir: {}
        {{- if .Values.localData.enabled }}
        - name: local-data
          {{- if .Values.localData.existingClaim }}
          persistentVolumeClaim:
            claimName: {{ .Values.localData.existingClaim | quote }}
            readOnly: true
          {{- else if .Values.localData.nfs.server }}
          nfs:
            server: {{ .Values.localData.nfs.server | quote }}
            path: {{ .Values.localData.nfs.path | quote }}
            readOnly: true
          {{- else }}
          hostPath:
            path: {{ .Values.localData.hostPath.path | quote }}
            type: Directory
          {{- end }}
        {{- end }}
