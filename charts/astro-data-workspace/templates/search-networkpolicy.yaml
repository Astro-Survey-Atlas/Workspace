{{- if eq .Values.search.mode "bundled" }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "astro-data-workspace.fullname" . }}-search
  labels:
    {{- include "astro-data-workspace.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: {{ include "astro-data-workspace.elasticsearchName" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: master
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: {{ include "astro-data-workspace.name" . }}
              app.kubernetes.io/instance: {{ .Release.Name }}
      ports:
        - port: 9200
          protocol: TCP
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: {{ include "astro-data-workspace.elasticsearchName" . }}
              app.kubernetes.io/instance: {{ .Release.Name }}
              app.kubernetes.io/component: master
      ports:
        - port: 9200
          protocol: TCP
        - port: 9300
          protocol: TCP
{{- end }}
