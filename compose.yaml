# State and ES volumes must be local; scan execution starts paused.
services:
  workspace-elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.18.0
    environment:
      discovery.type: single-node
      xpack.security.enabled: 'false'
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    volumes:
    - type: volume
      source: search
      target: /usr/share/elasticsearch/data
    ports:
    - ${ASTRO_ES_PORT:-9200}:9200
    healthcheck:
      test:
      - CMD-SHELL
      - curl --silent --fail 'http://127.0.0.1:9200/_cluster/health?wait_for_status=yellow&timeout=1s'
        >/dev/null
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
  workspace:
    build:
      context: .
      dockerfile: Dockerfile
    image: asa-workspace:local
    depends_on: &id001
      workspace-elasticsearch:
        condition: service_healthy
    user: 10001:10001
    read_only: true
    cap_drop: &id002
    - ALL
    security_opt: &id003
    - no-new-privileges:true
    environment:
      HOST: 0.0.0.0
      PORT: '3000'
      ASTRO_LOCAL_CONNECTOR_ROOTS: /state/coverage-downloads
      ASTRO_COVERAGE_DOWNLOAD_ROOT: /state/coverage-downloads
      ASTRO_ES_URL: http://workspace-elasticsearch:9200
      ASTRO_SQLITE_PATH: /state/workspace.sqlite
      ASTRO_STATE_ROOT: /state
      ASTRO_SURVEY_REGISTRY_STATE: /state/survey-registrations.json
      ASTRO_WORKFLOW_ROOT: /state/workflow-runs
      ASTRO_RESOURCE_PACKAGE_ROOT: /state/resource-packages
      ASTRO_RESOURCE_PACKAGE_STATE: /state/resource-package-state.json
      ASTRO_SCANS_PAUSED: 'true'
      ASTRO_WORKSPACE_SCAN_ENABLED: 'true'
    ports:
    - ${ASTRO_PORT:-3000}:3000
    volumes: &id004
    - type: volume
      source: state
      target: /state
    tmpfs: &id005
    - /tmp
    healthcheck:
      test:
      - CMD
      - node
      - -e
      - 'fetch("http://127.0.0.1:3000/healthz").then((response) => process.exit(response.ok
        ? 0 : 1)).catch(() => process.exit(1))'
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
  scanner:
    image: asa-workspace:local
    depends_on: *id001
    user: 10001:10001
    read_only: true
    cap_drop: *id002
    security_opt: *id003
    environment:
      HOST: 0.0.0.0
      PORT: '3000'
      ASTRO_LOCAL_CONNECTOR_ROOTS: /state/coverage-downloads
      ASTRO_COVERAGE_DOWNLOAD_ROOT: /state/coverage-downloads
      ASTRO_ES_URL: http://workspace-elasticsearch:9200
      ASTRO_SQLITE_PATH: /state/workspace.sqlite
      ASTRO_STATE_ROOT: /state
      ASTRO_SURVEY_REGISTRY_STATE: /state/survey-registrations.json
      ASTRO_WORKFLOW_ROOT: /state/workflow-runs
      ASTRO_RESOURCE_PACKAGE_ROOT: /state/resource-packages
      ASTRO_RESOURCE_PACKAGE_STATE: /state/resource-package-state.json
      ASTRO_SCANS_PAUSED: 'true'
      ASTRO_WORKSPACE_SCAN_ENABLED: 'true'
      OTEL_SERVICE_NAME: asa-workspace-scanner
    volumes: *id004
    tmpfs: *id005
    command:
    - node
    - dist/scan-worker.js
volumes:
  state:
    name: asa-workspace-state
  search:
    name: asa-workspace-search
