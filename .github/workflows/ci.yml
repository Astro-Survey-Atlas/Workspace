name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    name: Build & test (node)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: vendor/moc-core/requirements.lock
      - run: npm ci
      - run: python -m pip install --requirement vendor/moc-core/requirements.lock
      - run: npm run build
      - run: npm test

  desktop:
    name: Desktop smoke (no GUI)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Install desktop deps (skip electron download)
        working-directory: desktop
        run: npm ci --ignore-scripts
      - name: Prepare server bundle
        working-directory: desktop
        run: npm run prepare:server
      - name: Run desktop smoke harness
        working-directory: desktop
        run: node scripts/smoke-main.cjs

  helm:
    name: Helm lint & render
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.16.3
      - name: helm lint
        run: helm lint charts/asa-workspace --strict
      - name: helm template (bundled modes)
        run: helm template workspace charts/asa-workspace > /dev/null
      - name: helm template (external owned search)
        run: |
          helm template workspace charts/asa-workspace \
            --set search.mode=external \
            --set search.external.existingSecret=workspace-connections \
            > /dev/null

  docker:
    name: Docker build (no push)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: asa-workspace:ci
          build-args: |
            ASTRO_BUILD_COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
