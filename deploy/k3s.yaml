apiVersion: v1
kind: Namespace
metadata:
  name: astro-data-workspace
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: astro-data-workspace-mcp
  namespace: astro-data-workspace
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: connector-credential-manager
  namespace: astro-data-workspace
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "create", "patch", "update", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: connector-credential-manager
  namespace: astro-data-workspace
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: connector-credential-manager
subjects:
  - kind: ServiceAccount
    name: astro-data-workspace-mcp
    namespace: astro-data-workspace
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: astro-workspace-connector-credential-reader
  namespace: warehouse
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["warehouse-s3-credential", "metadata-minio-secret"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: astro-workspace-connector-credential-reader
  namespace: warehouse
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: astro-workspace-connector-credential-reader
subjects:
  - kind: ServiceAccount
    name: astro-data-workspace-mcp
    namespace: astro-data-workspace
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: astro-workspace-flink-bridge
  namespace: warehouse
rules:
  - apiGroups: ["org.zhejianglab.astro.metadata"]
    resources: ["flinkingesttasks", "flinkingesttasks/status"]
    verbs: ["get", "list", "watch", "create", "patch", "update"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "create", "patch", "update", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: astro-workspace-flink-bridge
  namespace: warehouse
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: astro-workspace-flink-bridge
subjects:
  - kind: ServiceAccount
    name: astro-data-workspace-mcp
    namespace: astro-data-workspace
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: registry-state
  namespace: astro-data-workspace
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: nfs-data
  resources:
    requests:
      storage: 256Mi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: workspace-metadata
  namespace: astro-data-workspace
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: nfs-data
  resources:
    requests:
      storage: 128Mi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: resource-packages
  namespace: astro-data-workspace
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: nfs-data
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: astro-data-workspace-mcp
  namespace: astro-data-workspace
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: astro-data-workspace-mcp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: astro-data-workspace-mcp
    spec:
      serviceAccountName: astro-data-workspace-mcp
      nodeSelector:
        kubernetes.io/hostname: eva7028
      imagePullSecrets:
        - name: aliyun-registry
      securityContext:
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: mcp
          image: crpi-wixjy6gci86ms14e.cn-hongkong.personal.cr.aliyuncs.com/ay-dev/astro-data-workspace-mcp:0.10.38-20260812062146
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: NODE_EXTRA_CA_CERTS
              value: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
            - name: ASTRO_WORKSPACE_STATE
              value: /state/registry.json
            - name: ASTRO_MANUAL_FOOTPRINT_STATE
              value: /state/manual-footprints.json
            - name: ASTRO_MANUAL_FOOTPRINT_ADMIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: astro-data-workspace-manual-footprints
                  key: admin-token
                  optional: true
            - name: ASTRO_ALLOWED_ROOTS
              value: /catalogs
            - name: ASTRO_BOOTSTRAP_CATALOG
              value: /catalogs/cosmos-clean-v2/processing_summary.csv
            - name: ASTRO_BOOTSTRAP_NAME
              value: COSMOS Clean V2
            - name: ASTRO_VOLUME_ROOT
              value: /volumes
            - name: ASTRO_ATLAS_ROOT
              value: /volumes
            - name: ASTRO_WORKFLOW_ROOT
              value: /state/workflow-runs
            - name: ASTRO_RESOURCE_CATALOG_URL
              value: file:///app/bootstrap/resource-packages/catalog.json
            - name: ASTRO_RESOURCE_PACKAGE_ROOT
              value: /resource-packages
            - name: ASTRO_RESOURCE_PACKAGE_STATE
              value: /state/resource-package-state.json
            - name: ASTRO_CONNECTOR_BOOTSTRAP
              value: /app/bootstrap/connectors.json
            - name: ASTRO_CATALOG_MCP_URL
              value: http://eva24002-entrance.lab.zverse.space:30082/mcp
            - name: ASTRO_CATALOG_MCP_TIMEOUT_MS
              value: "15000"
            # The warehouse-local Elasticsearch contains connector scan results.
            # Keep this inside the cluster; the public NodePort is for the workspace API only.
            - name: ASTRO_ES_URL
              value: http://warehouse-elasticsearch.warehouse.svc.cluster.local:9200
            - name: ASTRO_ES_ASTRO_INDEX
              value: astro_file_index_v1
            - name: ASTRO_ES_OVERVIEW_CACHE_MS
              value: "60000"
            - name: ASTRO_FLINK_NAMESPACE
              value: warehouse
            - name: ASTRO_FLINK_SECRET_NAMESPACE
              value: warehouse
            - name: ASTRO_FLINK_POLL_MS
              value: "5000"
            - name: ASTRO_ALLOWED_HOSTS
              value: localhost,127.0.0.1,10.15.49.212,10.15.51.75,astro.workspace.dev.72602.space,astro-data-workspace-mcp,astro-data-workspace-mcp.astro-data-workspace,astro-data-workspace-mcp.astro-data-workspace.svc,astro-data-workspace-mcp.astro-data-workspace.svc.cluster.local
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
              httpHeaders:
                - name: Host
                  value: astro-data-workspace-mcp
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
              httpHeaders:
                - name: Host
                  value: astro-data-workspace-mcp
            initialDelaySeconds: 5
            periodSeconds: 15
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
          volumeMounts:
            - name: registry-state
              mountPath: /state
            - name: resource-packages
              mountPath: /resource-packages
            - name: tmp
              mountPath: /tmp
            - name: cosmos-clean-v2
              mountPath: /catalogs/cosmos-clean-v2
              subPath: catalogs/cosmos-clean-v2
              readOnly: true
            - name: redshift-volumes
              mountPath: /volumes
              subPath: volumes
              readOnly: true
      volumes:
        - name: registry-state
          persistentVolumeClaim:
            claimName: registry-state
        - name: resource-packages
          persistentVolumeClaim:
            claimName: resource-packages
        - name: tmp
          emptyDir: {}
        - name: cosmos-clean-v2
          persistentVolumeClaim:
            claimName: workspace-metadata
        - name: redshift-volumes
          persistentVolumeClaim:
            claimName: workspace-metadata
---
apiVersion: v1
kind: Service
metadata:
  name: astro-data-workspace-mcp
  namespace: astro-data-workspace
spec:
  selector:
    app.kubernetes.io/name: astro-data-workspace-mcp
  ports:
    - name: http
      port: 3000
      targetPort: http
      nodePort: 32082
  type: NodePort
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: astro-data-workspace
  namespace: astro-data-workspace
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "480"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "480"
spec:
  ingressClassName: nginx
  rules:
    - host: astro.workspace.dev.72602.space
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: astro-data-workspace-mcp
                port:
                  name: http
