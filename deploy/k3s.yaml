          image: crpi-wixjy6gci86ms14e.cn-hongkong.personal.cr.aliyuncs.com/ay-dev/astro-data-workspace-mcp:0.10.38-20260901-193243
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: NODE_EXTRA_CA_CERTS
              value: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
            - name: ASTRO_STATE_ROOT
              value: /state
            - name: ASTRO_DATA_WAREHOUSE_ENABLED
              value: "true"
            - name: ASTRO_LOCAL_SCAN_ENABLED
              value: "true"
            - name: ASTRO_METADATA_STORE
