            - name: ASTRO_RESOURCE_CATALOG_ALLOWED_ORIGINS
              value: http://astro-survey-atlas-assets.astro-survey-atlas-assets.svc.cluster.local
            - name: ASTRO_RESOURCE_ADMIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: astro-data-workspace-resource-admin
                  key: admin-token
            - name: ASTRO_RESOURCE_SNAPSHOT_ROOT
              value: /state
            - name: ASTRO_RESOURCE_PACKAGE_ROOT
              value: /resource-packages
            - name: ASTRO_RESOURCE_PACKAGE_STATE
              value: /state/resource-package-state.json
            - name: ASTRO_CATALOG_MCP_URL
              value: http://eva24002-entrance.lab.zverse.space:30082/mcp
            - name: ASTRO_CATALOG_MCP_TIMEOUT_MS
              value: "15000"
            # Independent search service for local object and coverage indices.
            # Keep this inside the cluster; the public NodePort is for the workspace API only.
            - name: ASTRO_ES_URL
              value: http://astro-data-workspace-elasticsearch.astro-data-workspace.svc.cluster.local:9200
            - name: ASTRO_ES_ASTRO_INDEX
              value: astro_file_index_v1
            - name: ASTRO_ES_OBJECT_INDEX
              value: astro_object_index_v1
            - name: ASTRO_ES_COVERAGE_INDEX
              value: astro_coverage_index_v1
            - name: ASTRO_ES_TIMEOUT_MS
              value: "30000"
            - name: ASTRO_ES_OVERVIEW_CACHE_MS
              value: "60000"
            - name: ASTRO_WAREHOUSE_NAMESPACE
              value: astro-data-workspace
            - name: ASTRO_WAREHOUSE_POLL_MS
              value: "5000"
            - name: ASTRO_WAREHOUSE_ES_URL
              value: http://atlas-warehouse-elasticsearch.atlas-warehouse.svc.cluster.local:9200
            - name: ASTRO_WAREHOUSE_LAYER_INDEX
              value: ast_layer_index_v1
            - name: ASTRO_WAREHOUSE_FILE_INDEX
              value: ast_file_index_v1
            - name: ASTRO_WAREHOUSE_COVERAGE_INDEX
              value: ast_coverage_index_v1
            - name: ASTRO_WAREHOUSE_EVIDENCE_CLAIM
              value: workspace-evidence
            - name: ASTRO_WAREHOUSE_EVIDENCE_MOUNT_PATH
              value: /var/lib/atlas-evidence
            - name: ASTRO_WAREHOUSE_SCANNER_IMAGE
              value: crpi-wixjy6gci86ms14e.cn-hongkong.personal.cr.aliyuncs.com/ay-dev/astro-atlas-scanner:0.2.0-20260826-shutdownfix1
            - name: ASTRO_ALLOWED_HOSTS
