apiVersion: v1
kind: Namespace
metadata:
  name: astro-data-workspace
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: astro-data-workspace-mcp
  namespace: astro-data-workspace
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: connector-credential-manager
  namespace: astro-data-workspace
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "create", "patch", "update", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: connector-credential-manager
  namespace: astro-data-workspace
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: connector-credential-manager
subjects:
  - kind: ServiceAccount
    name: astro-data-workspace-mcp
    namespace: astro-data-workspace
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: astro-workspace-connector-credential-reader
  namespace: warehouse
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["warehouse-s3-credential", "metadata-minio-secret"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: astro-workspace-connector-credential-reader
  namespace: warehouse
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: astro-workspace-connector-credential-reader
subjects:
  - kind: ServiceAccount
    name: astro-data-workspace-mcp
    namespace: astro-data-workspace
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: astro-workspace-metadata-scan-bridge
  namespace: warehouse
rules:
  - apiGroups: ["org.zhejianglab.astro.metadata"]
    resources: ["astrodatasources", "astrodatasources/status", "astrometadatascantasks", "astrometadatascantasks/status"]
    verbs: ["get", "list", "watch", "create", "patch", "update"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "create", "patch", "update", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: astro-workspace-metadata-scan-bridge
  namespace: warehouse
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: astro-workspace-metadata-scan-bridge
subjects:
  - kind: ServiceAccount
    name: astro-data-workspace-mcp
    namespace: astro-data-workspace
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: registry-state
  namespace: astro-data-workspace
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: nfs-data
  resources:
    requests:
      storage: 256Mi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: workspace-metadata
  namespace: astro-data-workspace
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: nfs-data
  resources:
    requests:
      storage: 128Mi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: resource-packages
  namespace: astro-data-workspace
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: nfs-data
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: astro-data-workspace-mcp
  namespace: astro-data-workspace
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: astro-data-workspace-mcp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: astro-data-workspace-mcp
    spec:
      serviceAccountName: astro-data-workspace-mcp
      nodeSelector:
        kubernetes.io/hostname: eva7028
      imagePullSecrets:
        - name: aliyun-registry
      securityContext:
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: mcp
          image: crpi-wixjy6gci86ms14e.cn-hongkong.personal.cr.aliyuncs.com/ay-dev/astro-data-workspace-mcp:0.10.38-20260821-public-release-layer-fix2
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: NODE_EXTRA_CA_CERTS
              value: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
            - name: ASTRO_STATE_ROOT
              value: /state
            - name: ASTRO_DATA_WAREHOUSE_ENABLED
              value: "true"
            - name: ASTRO_LOCAL_SCAN_ENABLED
              value: "true"
            - name: ASTRO_METADATA_STORE
              value: sqlite
            - name: ASTRO_SQLITE_PATH
              value: /state/workspace.sqlite
            - name: ASTRO_DATA_CATALOG_STATE
              value: /state/data-catalog.json
            - name: ASTRO_CONNECTOR_STATE
              value: /state/connectors.json
            - name: ASTRO_CONNECTOR_RUN_STATE
              value: /state/connector-ingest-runs.json
            - name: ASTRO_LOCAL_CONNECTOR_ROOTS
              value: /data/local:/catalogs
            - name: ASTRO_WORKFLOW_ROOT
              value: /state/workflow-runs
            - name: ASTRO_RESOURCE_CATALOG_URL
              value: http://astro-survey-atlas-assets.astro-survey-atlas-assets.svc.cluster.local/api/v1/resource-packages/catalog.json
            - name: ASTRO_RESOURCE_CATALOG_ALLOWED_ORIGINS
              value: http://astro-survey-atlas-assets.astro-survey-atlas-assets.svc.cluster.local
            - name: ASTRO_RESOURCE_ADMIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: astro-data-workspace-resource-admin
                  key: admin-token
            - name: ASTRO_RESOURCE_SNAPSHOT_ROOT
              value: /state
            - name: ASTRO_RESOURCE_PACKAGE_ROOT
              value: /resource-packages
            - name: ASTRO_RESOURCE_PACKAGE_STATE
              value: /state/resource-package-state.json
            - name: ASTRO_CATALOG_MCP_URL
              value: http://eva24002-entrance.lab.zverse.space:30082/mcp
            - name: ASTRO_CATALOG_MCP_TIMEOUT_MS
              value: "15000"
            # Independent search service for local object and coverage indices.
            # Keep this inside the cluster; the public NodePort is for the workspace API only.
            - name: ASTRO_ES_URL
              value: http://astro-search-elasticsearch.astro-data-workspace.svc.cluster.local:9200
            - name: ASTRO_ES_ASTRO_INDEX
              value: astro_file_index_v1
            - name: ASTRO_ES_OBJECT_INDEX
              value: astro_object_index_v1
            - name: ASTRO_ES_COVERAGE_INDEX
              value: astro_coverage_index_v1
            - name: ASTRO_ES_OVERVIEW_CACHE_MS
              value: "60000"
            - name: ASTRO_FLINK_NAMESPACE
              value: warehouse
            - name: ASTRO_FLINK_SECRET_NAMESPACE
              value: warehouse
            - name: ASTRO_FLINK_POLL_MS
              value: "5000"
            - name: ASTRO_FLINK_ES_HOST
              value: astro-search-elasticsearch.astro-data-workspace.svc.cluster.local
            - name: ASTRO_FLINK_ES_PORT
              value: "9200"
            - name: ASTRO_FLINK_ES_SCHEMA
              value: http
            - name: ASTRO_ALLOWED_HOSTS
              value: localhost,127.0.0.1,10.15.49.212,10.15.51.75,astro.workspace.dev.72602.space,astro-data-workspace-mcp,astro-data-workspace-mcp.astro-data-workspace,astro-data-workspace-mcp.astro-data-workspace.svc,astro-data-workspace-mcp.astro-data-workspace.svc.cluster.local
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
              httpHeaders:
                - name: Host
                  value: astro-data-workspace-mcp
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
              httpHeaders:
                - name: Host
                  value: astro-data-workspace-mcp
            initialDelaySeconds: 5
            periodSeconds: 15
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
          volumeMounts:
            - name: registry-state
              mountPath: /state
            - name: resource-packages
              mountPath: /resource-packages
            - name: tmp
              mountPath: /tmp
            - name: local-data
              mountPath: /data/local
              readOnly: true
      volumes:
        - name: registry-state
          persistentVolumeClaim:
            claimName: registry-state
        - name: resource-packages
          persistentVolumeClaim:
            claimName: resource-packages
        - name: tmp
          emptyDir: {}
        - name: local-data
          nfs:
            server: 10.15.49.212
            path: /mnt/data/catalogs
            readOnly: true
---
apiVersion: v1
kind: Service
metadata:
  name: astro-data-workspace-mcp
  namespace: astro-data-workspace
spec:
  selector:
    app.kubernetes.io/name: astro-data-workspace-mcp
  ports:
    - name: http
      port: 3000
      targetPort: http
      nodePort: 32082
  type: NodePort
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: astro-data-workspace
  namespace: astro-data-workspace
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "480"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "480"
spec:
  ingressClassName: nginx
  rules:
    - host: astro.workspace.dev.72602.space
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: astro-data-workspace-mcp
                port:
                  name: http
