apiVersion: v1
kind: Namespace
metadata:
  name: astro-data-workspace
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: astro-data-workspace-mcp
  namespace: astro-data-workspace
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: connector-credential-manager
  namespace: astro-data-workspace
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "create", "patch", "update", "delete"]
  - apiGroups: ["atlas.zhejianglab.org"]
    resources: ["scanrequests"]
    verbs: ["get", "list", "watch", "create", "patch", "update"]
  - apiGroups: ["atlas.zhejianglab.org"]
    resources: ["scanrequests/status"]
    verbs: ["get", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: connector-credential-manager
  namespace: astro-data-workspace
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: connector-credential-manager
subjects:
  - kind: ServiceAccount
    name: astro-data-workspace-mcp
    namespace: astro-data-workspace
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: registry-state
  namespace: astro-data-workspace
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: nfs-data
  resources:
    requests:
      storage: 256Mi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: workspace-metadata
  namespace: astro-data-workspace
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: nfs-data
  resources:
    requests:
      storage: 128Mi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: resource-packages
  namespace: astro-data-workspace
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: nfs-data
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: workspace-evidence
  namespace: astro-data-workspace
  labels:
    atlas.zhejianglab.org/evidence: "true"
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: nfs-data
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: workspace-search-data
  namespace: astro-data-workspace
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: nfs-data
  resources:
    requests:
      storage: 20Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: astro-data-workspace-elasticsearch
  namespace: astro-data-workspace
  labels:
    app.kubernetes.io/name: astro-data-workspace-elasticsearch
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: astro-data-workspace-elasticsearch
  template:
    metadata:
      labels:
        app.kubernetes.io/name: astro-data-workspace-elasticsearch
    spec:
      securityContext:
        fsGroup: 1001
        fsGroupChangePolicy: Always
      containers:
        - name: elasticsearch
          image: container-image-mirror.eva24002.lab.zverse.space:32443/docker.io/bitnamilegacy/elasticsearch:8.12.2-debian-12-r0
          imagePullPolicy: IfNotPresent
          env:
            - name: ELASTICSEARCH_IS_DEDICATED_NODE
              value: "no"
            - name: ELASTICSEARCH_NODE_ROLES
              value: master
            - name: ELASTICSEARCH_TRANSPORT_PORT_NUMBER
              value: "9300"
            - name: ELASTICSEARCH_HTTP_PORT_NUMBER
              value: "9200"
            - name: ELASTICSEARCH_CLUSTER_NAME
              value: astro-workspace
            - name: ELASTICSEARCH_HEAP_SIZE
              value: 512m
          ports:
            - name: http
              containerPort: 9200
            - name: transport
              containerPort: 9300
          readinessProbe:
            exec:
              command:
                - /opt/bitnami/scripts/elasticsearch/healthcheck.sh
            initialDelaySeconds: 90
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 180
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
          resources:
            requests:
              cpu: 250m
              memory: 1Gi
            limits:
              cpu: "1"
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
            runAsUser: 1001
            runAsGroup: 0
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: data
              mountPath: /bitnami/elasticsearch/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: workspace-search-data
---
apiVersion: v1
kind: Service
metadata:
  name: astro-data-workspace-elasticsearch
  namespace: astro-data-workspace
  labels:
    app.kubernetes.io/name: astro-data-workspace-elasticsearch
spec:
  selector:
    app.kubernetes.io/name: astro-data-workspace-elasticsearch
  ports:
    - name: http
      port: 9200
      targetPort: http
    - name: transport
      port: 9300
      targetPort: transport
---
apiVersion: batch/v1
kind: Job
metadata:
  name: astro-data-workspace-search-init
  namespace: astro-data-workspace
  labels:
    app.kubernetes.io/name: astro-data-workspace-search-init
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 900
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: astro-data-workspace-search-init
    spec:
      automountServiceAccountToken: false
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: initialize-search
          image: curlimages/curl:8.14.1
          imagePullPolicy: IfNotPresent
          env:
            - name: ASTRO_ES_URL
              value: http://astro-data-workspace-elasticsearch.astro-data-workspace.svc.cluster.local:9200
            - name: FILE_INDEX
              value: astro_file_index_v1
            - name: OBJECT_INDEX
              value: astro_object_index_v1
            - name: COVERAGE_INDEX
              value: astro_coverage_index_v1
          command:
            - /bin/sh
            - -ec
          args:
            - |
              base_url="${ASTRO_ES_URL%/}"
              response_file=/tmp/elasticsearch-response

              request_status() {
                method="$1"
                path="$2"
                payload="${3-}"
                : > "$response_file"
                if [ -n "$payload" ]; then
                  curl --silent --show-error --output "$response_file" --write-out '%{http_code}' \
                    --request "$method" --header 'Content-Type: application/json' \
                    --data "$payload" "${base_url}${path}"
                else
                  curl --silent --show-error --output "$response_file" --write-out '%{http_code}' \
                    --request "$method" "${base_url}${path}"
                fi
              }

              wait_for_search() {
                attempt=1
                while [ "$attempt" -le 60 ]; do
                  if status="$(request_status GET '/_cluster/health?wait_for_status=yellow&timeout=3s')"; then
                    case "$status" in
                      2??) return 0 ;;
                    esac
                  fi
                  if [ "$attempt" -eq 60 ]; then
                    echo "Elasticsearch did not become ready" >&2
                    cat "$response_file" >&2 || true
                    return 1
                  fi
                  echo "Waiting for Workspace Elasticsearch ($attempt/60)..."
                  attempt=$((attempt + 1))
                  sleep 5
                done
              }

              ensure_index() {
                index="$1"
                mapping="$2"
                if ! status="$(request_status GET "/$index")"; then
                  echo "Unable to inspect Elasticsearch index: $index" >&2
                  return 1
                fi
                case "$status" in
                  200)
                    if ! status="$(request_status PUT "/$index/_mapping" "$mapping")"; then
                      echo "Unable to reconcile Elasticsearch mapping: $index" >&2
                      return 1
                    fi
                    case "$status" in
                      2??) ;;
                      *) echo "Elasticsearch returned HTTP $status while reconciling $index" >&2; cat "$response_file" >&2 || true; return 1 ;;
                    esac
                    ;;
                  404)
                    if ! status="$(request_status PUT "/$index" "{\"mappings\":$mapping}")"; then
                      echo "Unable to create Elasticsearch index: $index" >&2
                      return 1
                    fi
                    case "$status" in
                      2??) ;;
                      400)
                        if ! grep -q 'resource_already_exists_exception' "$response_file"; then
                          echo "Elasticsearch returned HTTP 400 while creating $index" >&2
                          cat "$response_file" >&2 || true
                          return 1
                        fi
                        ;;
                      *) echo "Elasticsearch returned HTTP $status while creating $index" >&2; cat "$response_file" >&2 || true; return 1 ;;
                    esac
                    ;;
                  *) echo "Elasticsearch returned HTTP $status while inspecting $index" >&2; cat "$response_file" >&2 || true; return 1 ;;
                esac
              }

              file_mapping='{"dynamic":true,"properties":{"file_id":{"type":"keyword"},"source_document_id":{"type":"keyword"},"urn":{"type":"keyword"},"connector_location_key":{"type":"keyword"},"asset_id":{"type":"keyword"},"scan_run_id":{"type":"keyword"},"name":{"type":"keyword"},"parent_path":{"type":"keyword"},"file_type":{"type":"keyword"},"size_bytes":{"type":"long"},"last_modified":{"type":"date"},"survey":{"type":"keyword"},"release":{"type":"keyword"},"product":{"type":"keyword"},"modality":{"type":"keyword"},"band":{"type":"keyword"},"spatial_status":{"type":"keyword"},"spatial_error":{"type":"text"},"healpix_order":{"type":"byte"},"coverage_order":{"type":"byte"},"coverage_cells":{"type":"integer"},"coverage_method":{"type":"keyword"},"coverage_role":{"type":"keyword"},"data_origin":{"type":"keyword"},"source_tier":{"type":"keyword"},"max_order":{"type":"byte"},"query_order":{"type":"byte"},"preview_order":{"type":"byte"},"coverage_quality":{"type":"keyword"},"coverage_frame":{"type":"keyword"},"coverage_moc_uri":{"type":"keyword"},"coverage_moc_sha256":{"type":"keyword"},"wcs_summary":{"type":"object","enabled":true},"parse_error":{"type":"text"}}}'
              object_mapping='{"dynamic":"strict","properties":{"object_id":{"type":"keyword"},"ra_deg":{"type":"double"},"dec_deg":{"type":"double"},"sky_position":{"type":"geo_point"},"healpix_order":{"type":"byte"},"healpix_pixel":{"type":"integer"},"survey":{"type":"keyword"},"release":{"type":"keyword"},"product":{"type":"keyword"},"modality":{"type":"keyword"},"asset_id":{"type":"keyword"},"source_file_id":{"type":"keyword"},"scan_run_id":{"type":"keyword"},"attributes":{"type":"flattened"}}}'
              coverage_mapping='{"dynamic":"strict","properties":{"healpix_order":{"type":"byte"},"healpix_pixel":{"type":"integer"},"objectCount":{"type":"long"},"survey":{"type":"keyword"},"release":{"type":"keyword"},"product":{"type":"keyword"},"modality":{"type":"keyword"},"asset_id":{"type":"keyword"},"source_file_id":{"type":"keyword"},"scan_run_id":{"type":"keyword"},"coverage_role":{"type":"keyword"},"data_origin":{"type":"keyword"},"source_tier":{"type":"keyword"},"max_order":{"type":"byte"},"query_order":{"type":"byte"},"preview_order":{"type":"byte"}}}'

              wait_for_search
              ensure_index "$FILE_INDEX" "$file_mapping"
              ensure_index "$OBJECT_INDEX" "$object_mapping"
              ensure_index "$COVERAGE_INDEX" "$coverage_mapping"
              echo "Workspace Elasticsearch indices are ready."
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: astro-data-workspace-mcp
  namespace: astro-data-workspace
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: astro-data-workspace-mcp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: astro-data-workspace-mcp
    spec:
      serviceAccountName: astro-data-workspace-mcp
      nodeSelector:
        kubernetes.io/hostname: eva7028
      imagePullSecrets:
        - name: aliyun-registry
      securityContext:
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
      containers:
