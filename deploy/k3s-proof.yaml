apiVersion: v1
kind: Namespace
metadata:
  name: astro-data-workspace
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: registry-state
  namespace: astro-data-workspace
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: nfs-data
  resources:
    requests:
      storage: 256Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: astro-data-workspace-mcp
  namespace: astro-data-workspace
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: astro-data-workspace-mcp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: astro-data-workspace-mcp
    spec:
      nodeSelector:
        kubernetes.io/hostname: eva7028
      securityContext:
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
      initContainers:
        - name: install-locked-dependencies
          image: docker.io/library/node:22.22.1-bookworm-slim
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -ec
          args:
            - |
              cp /source/package.json /source/package-lock.json /app/
              mkdir -p /app/dist /app/fixtures
              cp /source/http-server.js /source/mcp.js /source/profile.js /source/registry.js /app/dist/
              cp /source/catalog.csv /app/fixtures/
              cd /app
              npm ci --omit=dev --registry=https://registry.npmmirror.com
          env:
            - name: npm_config_cache
              value: /tmp/npm-cache
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
            runAsUser: 10001
          volumeMounts:
            - name: app
              mountPath: /app
            - name: source
              mountPath: /source
              readOnly: true
            - name: tmp
              mountPath: /tmp
      containers:
        - name: mcp
          image: docker.io/library/node:22.22.1-bookworm-slim
          imagePullPolicy: IfNotPresent
          command:
            - node
            - /app/dist/http-server.js
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: ASTRO_WORKSPACE_STATE
              value: /state/registry.json
            - name: ASTRO_ALLOWED_ROOTS
              value: /app/fixtures
            - name: ASTRO_ALLOWED_HOSTS
              value: localhost,127.0.0.1,astro-data-workspace-mcp,astro-data-workspace-mcp.astro-data-workspace,astro-data-workspace-mcp.astro-data-workspace.svc,astro-data-workspace-mcp.astro-data-workspace.svc.cluster.local
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
              httpHeaders:
                - name: Host
                  value: astro-data-workspace-mcp
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
              httpHeaders:
                - name: Host
                  value: astro-data-workspace-mcp
            initialDelaySeconds: 5
            periodSeconds: 15
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
          volumeMounts:
            - name: app
              mountPath: /app
              readOnly: true
            - name: registry-state
              mountPath: /state
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: app
          emptyDir: {}
        - name: source
          configMap:
            name: astro-data-workspace-source
        - name: registry-state
          persistentVolumeClaim:
            claimName: registry-state
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: astro-data-workspace-mcp
  namespace: astro-data-workspace
spec:
  selector:
    app.kubernetes.io/name: astro-data-workspace-mcp
  ports:
    - name: http
      port: 3000
      targetPort: http
  type: ClusterIP
